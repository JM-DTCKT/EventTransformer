backbone_params:
  downsample_pos_enc: 6
  embed_dim: 128
  event_projection:
    name: MLP
    params:
      init_layers:
      - ff_96_gel
  num_latent_vectors: 96
  pos_enc_grad: true
  pos_encoding:
    name: fourier
    params:
      bands: 16
      shape:
      - 128
      - 128
  preproc_events:
    name: MLP
    params:
      init_layers:
      - ff_-1_gel
  proc_embs:
    clf_mode: gap
    embs_norm: true
    params: {}
  proc_events:
    name: MLP
    params:
      add_x_input: true
      dropout: 0.1
      init_layers:
      - ff_-1_rel
      - ff_-1_rel
  proc_memory:
    name: TransformerBlock
    params:
      att_dropout: 0.0
      cross_heads: 4
      dropout: 0.1
      heads: 4
      latent_blocks: 2
  return_last_q: false
  token_dim: 144
clf_params:
  lvl_embs:
  - -1
  opt_classes: 11
loss_weights: !!python/object/apply:torch._utils._rebuild_tensor_v2
- !!python/object/apply:torch.storage._load_from_bytes
  - !!binary |
    gAKKCmz8nEb5IGqoUBkugAJN6QMugAJ9cQAoWBAAAABwcm90b2NvbF92ZXJzaW9ucQFN6QNYDQAA
    AGxpdHRsZV9lbmRpYW5xAohYCgAAAHR5cGVfc2l6ZXNxA31xBChYBQAAAHNob3J0cQVLAlgDAAAA
    aW50cQZLBFgEAAAAbG9uZ3EHSwR1dS6AAihYBwAAAHN0b3JhZ2VxAGN0b3JjaApGbG9hdFN0b3Jh
    Z2UKcQFYCQAAADc0OTk3MTA0MHECWAMAAABjcHVxA0sLTnRxBFEugAJdcQBYCQAAADc0OTk3MTA0
    MHEBYS4LAAAAAAAAALn0jD+DhIs/g4SLP4OEiz+DhIs/g4SLP70bij+DhAs/g4SLP7n0jD+DhIs/
- 0
- !!python/tuple
  - 11
- !!python/tuple
  - 1
- false
- !!python/object/apply:collections.OrderedDict
  - []
optim_params:
  monitor: val_loss_total
  optim_params:
    lr: 0.001
  scheduler:
    name: one_cycle_lr
    params:
      epochs: 240
      steps_per_epoch: 1
